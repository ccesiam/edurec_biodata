openapi: 3.0.3
info:
  title: EduRec - BioData API Services
  version: "1.0"
  description: |
    This is the Boomi API documentation for the EduRec - BioData API Service.

    ### History

    | Version | Author | Date | Changes |
    | --- | --- | --- | --- |
    | 1.0 | [Shyamkumar Sukumaran](mailto:shyam@nus.edu.sg) | 04 Sept 2026 | Initial API documentation |
  x-boomi-branch: main
security:
  - apiKeyAuth: []
    appKeyAuth: []
servers:
  - url: https://nus-test-broker.boomi.cloud:8077/ws/rest/test/
    description: Boomi Test server
  - url: https://nus-test-broker.boomi.cloud:8077/ws/rest/qat/
    description: Boomi QAT server
  - url: https://nus-prod-broker.boomi.cloud:8077/ws/rest/
    description: Boomi Prod server
tags:
  - name: Bio Data
    description: EduRec biographical data services.
paths:
  /edurec/biodata/v1/adsi:
    get:
      tags: [Bio Data]
      operationId: getBioAdmNsi
      summary: Get Bio ADM NSI
      x-boomi-process: "[WSS] EduRec-Bio-001 - Bio - Get Bio ADM NSI"
      parameters:
        - $ref: '#/components/parameters/natid'
        - $ref: '#/components/parameters/offlname'
        - $ref: '#/components/parameters/sex'
        - $ref: '#/components/parameters/birthdate'
        - $ref: '#/components/parameters/svcimpact'
      responses:
        '200': { $ref: '#/components/responses/BioAdmNsiSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /edurec/biodata/v1/basic:
    get:
      tags: [Bio Data]
      operationId: getBioBasic
      summary: Get Bio Basic
      x-boomi-process: "[WSS] EduRec-Bio-002 - Bio - Get Bio Basic"
      parameters:
        - $ref: '#/components/parameters/term'
        - $ref: '#/components/parameters/emplid'
        - $ref: '#/components/parameters/activef'
        - $ref: '#/components/parameters/crse_cd'
      responses:
        '200': { $ref: '#/components/responses/BioBasicSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /edurec/biodata/v1/contact:
    get:
      tags: [Bio Data]
      operationId: getBioContact
      summary: Get Bio Contact
      x-boomi-process: "[WSS] EduRec-Bio-003 - Bio - Get Bio Contact"
      parameters:
        - $ref: '#/components/parameters/term'
        - $ref: '#/components/parameters/emplid'
        - $ref: '#/components/parameters/activef'
        - $ref: '#/components/parameters/crse_cd'
        - $ref: '#/components/parameters/officialnm'
      responses:
        '200': { $ref: '#/components/responses/BioContactSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /edurec/biodata/v1/detail:
    get:
      tags: [Bio Data]
      operationId: getBioDetail
      summary: Get Bio Detail
      x-boomi-process: "[WSS] EduRec-Bio-004 - Bio - Get Bio Detail"
      parameters:
        - $ref: '#/components/parameters/term'
        - $ref: '#/components/parameters/emplid'
        - $ref: '#/components/parameters/activef'
        - $ref: '#/components/parameters/crse_cd'
      responses:
        '200': { $ref: '#/components/responses/BioDetailSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /edurec/biodata/v1/detail/restricted:
    get:
      tags: [Bio Data]
      operationId: getBioDetailRestricted
      summary: Get Bio Detail Restricted
      x-boomi-process: "[WSS] EduRec-Bio-009 - Bio - Get Bio Detail Restricted"
      parameters:
        - $ref: '#/components/parameters/term'
        - $ref: '#/components/parameters/emplid'
        - $ref: '#/components/parameters/activef'
        - $ref: '#/components/parameters/crse_cd'
      responses:
        '200': { $ref: '#/components/responses/BioDetailRestrictedSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /edurec/biodata/v1/idmap:
    get:
      tags: [Bio Data]
      operationId: getBioIdMap
      summary: Get Bio ID Map
      x-boomi-process: "[WSS] EduRec-Bio-005 - Bio - Get Bio ID Map"
      parameters:
        - $ref: '#/components/parameters/emplid'
      responses:
        '200': { $ref: '#/components/responses/BioIdMapSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /edurec/biodata/v1/nid:
    get:
      tags: [Bio Data]
      operationId: getBioNid
      summary: Get Bio NID
      x-boomi-process: "[WSS] EduRec-Bio-006 - Bio - Get Bio NID"
      parameters:
        - $ref: '#/components/parameters/term'
        - $ref: '#/components/parameters/emplid'
        - $ref: '#/components/parameters/activef'
        - $ref: '#/components/parameters/crse_cd'
        - $ref: '#/components/parameters/officialnm'
      responses:
        '200': { $ref: '#/components/responses/BioNidSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /edurec/biodata/v1/si:
    get:
      tags: [Bio Data]
      operationId: getBioNsi
      summary: Get Bio NSI
      x-boomi-process: "[WSS] EduRec-Bio-007 - Bio - Get Bio NSI"
      parameters:
        - $ref: '#/components/parameters/emplid'
        - $ref: '#/components/parameters/term'
        - $ref: '#/components/parameters/activef'
        - $ref: '#/components/parameters/crse_cd'
        - $ref: '#/components/parameters/svcimpact'
      responses:
        '200': { $ref: '#/components/responses/BioNsiSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /edurec/biodata/v1/tmpstf:
    get:
      tags: [Bio Data]
      operationId: getBioTempStaff
      summary: Get Bio Temp Staff
      x-boomi-process: "[WSS] EduRec-Bio-008 - Bio - Get Bio Temp Staff"
      parameters:
        - $ref: '#/components/parameters/offlname'
        - $ref: '#/components/parameters/emplid'
      responses:
        '200': { $ref: '#/components/responses/BioTempStaffSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Enter the X-API-KEY value.
    appKeyAuth:
      type: apiKey
      in: header
      name: X-APP-KEY
      description: Enter the X-APP-KEY value.
  schemas:
    BioAdmNsiResponse:
      type: object
      properties:
        msg: { type: string }
        code: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              StudentID: { type: string }
              CampusID: { type: string }
              StudentName: { type: string }
              ServiceXref:
                type: array
                items:
                  type: object
                  properties:
                    SrvcIndDttm: { type: string }
                    SrvcIndCD: { type: string }
                    SrvcIndDescr: { type: string }
                    SrvcIndReason: { type: string }
                    SrvcIndReasonDescr: { type: string }
                    ServiceImpact:
                      type: array
                      items:
                        type: object
                        properties:
                          ServiceImpact: { type: string }
                          ServiceImpactDescr: { type: string }
        ts: { type: string }
    BioTempStaffResponse:
      type: object
      properties:
        msg: { type: string }
        code: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              AcadOrganisationDescription: { type: string }
              AcademicOrganisation: { type: string }
              ExpiryDate: { type: string, nullable: true }
              FirstName: { type: string }
              FullName: { type: string }
              Gender: { type: string }
              Id: { type: string }
              LastName: { type: string }
              OfficialEmail: { type: string }
              Salutation: { type: string }
        ts: { type: string }
    BioNsiResponse:
      type: object
      properties:
        msg: { type: string }
        code: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              FullName: { type: string }
              Id: { type: string }
              OldId: { type: string }
              ServiceIndicatorGroup:
                type: array
                items:
                  type: object
                  properties:
                    SvcIndicatorDateTime: { type: string }
                    SvcIndicatorReasonDesc: { type: string }
                    SvcIndicatorDescription: { type: string }
                    SvcImpactGroup:
                      type: array
                      items:
                        type: object
                        properties:
                          ImpactDescription: { type: string }
                          ImpactCode: { type: string }
                    SvcIndicatorCode: { type: string }
                    SvcIndicatorReason: { type: string }
        ts: { type: string }
    BioNidResponse:
      type: object
      properties:
        msg: { type: string }
        code: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              Birthdate: { type: string }
              CitizenPassport:
                type: array
                items:
                  type: object
                  properties:
                    PassportNbr: { type: string }
              Code: { type: string }
              ConsentFlag: { type: string, nullable: true }
              Country: { type: string }
              CountryCode: { type: string }
              FullName: { type: string }
              Id: { type: string }
              OldId: { type: string, nullable: true }
        ts: { type: string }
    BioIdMapResponse:
      type: object
      properties:
        msg: { type: string }
        code: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              Id: { type: string }
              OldId: { type: string }
        ts: { type: string }
    BioDetailRestrictedResponse:
      type: object
      properties:
        msg: { type: string }
        code: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              AddressGroup:
                type: array
                items:
                  type: object
                  properties:
                    Description: { type: string }
                    CountryCode: { type: string }
                    Address1: { type: string }
                    Address2: { type: string }
                    Address3: { type: string }
                    Address4: { type: string }
                    PostalCode: { type: string }
                    Type: { type: string }
              BirthCountry: { type: string }
              BirthCountryCode: { type: string }
              Birthdate: { type: string }
              CITI_PP:
                type: array
                items:
                  type: object
                  properties:
                    PassportNbr: { type: string }
              Citizenship: { type: string }
              ConsentFlag: { type: string }
              CountryCode: { type: string }
              FullName: { type: string }
              Gender: { type: string }
              Id: { type: string, nullable: true }
              OfficialEmail: { type: string }
              OldId: { type: string }
              PhoneGroup:
                type: array
                items:
                  type: object
                  properties:
                    ContactNumber: { type: string }
                    Type: { type: string }
                    Description: { type: string }
              ReligiousPref: { type: string }
              Salutation: { type: string }
        ts: { type: string }
    BioContactResponse:
      type: object
      properties:
        msg: { type: string }
        code: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              AddressGroup:
                type: array
                items:
                  type: object
                  properties:
                    Description: { type: string }
                    CountryCode: { type: string }
                    Address1: { type: string }
                    Address2: { type: string }
                    Address3: { type: string }
                    Address4: { type: string }
                    Country: { type: string }
                    PostalCode: { type: string }
                    Type: { type: string }
              ConsentFlag: { type: string }
              FullName: { type: string }
              Id: { type: string }
              OfficialEmail: { type: string }
              OldId: { type: string }
              PhoneGroup:
                type: array
                items:
                  type: object
                  properties:
                    ContactNumber: { type: string }
                    Type: { type: string }
                    Description: { type: string }
        ts: { type: string }
    BioBasicResponse:
      type: object
      properties:
        msg: { type: string }
        code: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              ConsentFlag: { type: string, nullable: true }
              FullName: { type: string }
              Gender: { type: string }
              Id: { type: string }
              OfficialEmail: { type: string }
              OldId: { type: string, nullable: true }
        ts: { type: string }
    BioDetailResponse:
      type: object
      properties:
        msg: { type: string }
        code: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              AddressGroup:
                type: array
                items:
                  type: object
                  properties:
                    Description: { type: string }
                    CountryCode: { type: string }
                    Address1: { type: string }
                    Address2: { type: string }
                    Address3: { type: string }
                    Address4: { type: string }
                    PostalCode: { type: string }
                    Type: { type: string }
              BirthCountry: { type: string }
              BirthCountryCode: { type: string }
              Birthdate: { type: string }
              CITI_PP:
                type: array
                nullable: true
                items:
                  type: object
                  additionalProperties: true
              Citizenship: { type: string }
              ConsentFlag: { type: string, nullable: true }
              CountryCode: { type: string }
              FullName: { type: string }
              Gender: { type: string }
              Id: { type: string }
              OfficialEmail: { type: string }
              OldId: { type: string }
              PhoneGroup:
                type: array
                items:
                  type: object
                  properties:
                    ContactNumber: { type: string }
                    Type: { type: string }
                    Description: { type: string }
              Residency: { type: string }
              Salutation: { type: string }
        ts: { type: string }
  parameters:
    natid: { name: natid, in: query, required: false, schema: { type: string } }
    offlname: { name: offlname, in: query, required: false, schema: { type: string } }
    sex: { name: sex, in: query, required: false, schema: { type: string } }
    birthdate: { name: birthdate, in: query, required: false, schema: { type: string } }
    svcimpact: { name: svcimpact, in: query, required: false, schema: { type: string } }
    term: { name: term, in: query, required: false, schema: { type: string } }
    emplid: { name: emplid, in: query, required: false, schema: { type: string } }
    activef: { name: activef, in: query, required: false, schema: { type: string } }
    crse_cd: { name: crse_cd, in: query, required: false, schema: { type: string } }
    officialnm: { name: officialnm, in: query, required: false, schema: { type: string } }
  responses:
    BioAdmNsiSuccess:
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BioAdmNsiResponse'
          example: |
            {
              "msg": "Success",
              "code": "200",
